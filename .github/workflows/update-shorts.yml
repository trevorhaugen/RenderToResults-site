name: Update latest YouTube Shorts

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install video metadata inspector
        run: python3 -m pip install --user yt-dlp
      - name: Fetch Shorts and update homepage
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update_shorts.py
      - name: Commit only if video lineup changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No new Shorts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automatically refresh latest YouTube Shorts"
          git push
